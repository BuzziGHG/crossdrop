name: Build & Release CrossDrop (.exe, .deb, .apk)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Windows (.exe)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Scaffold Windows Platform Files
        working-directory: ./client
        run: flutter create . --platforms=windows --org com.crossdrop

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build Windows Release
        working-directory: ./client
        run: flutter build windows --release

      - name: Create Portable Windows ZIP
        run: |
          Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath CrossDrop-Windows-x64.zip

      - name: Build Windows Setup Installer (.exe)
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          Write-Host "Compiling Windows Installer using $isccPath..."
          & "$isccPath" build_scripts\crossdrop_installer.iss
          Move-Item -Path build_scripts\CrossDrop-Windows-Setup.exe -Destination CrossDrop-Windows-Setup.exe

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Windows-x64
          path: CrossDrop-Windows-x64.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Windows-Setup
          path: CrossDrop-Windows-Setup.exe

  # 2. Build Linux (.deb)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Scaffold Linux Platform Files
        working-directory: ./client
        run: flutter create . --platforms=linux --org com.crossdrop

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build Linux & Package .deb
        run: |
          chmod +x build_scripts/build_linux.sh
          ./build_scripts/build_linux.sh

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Linux-Debian
          path: build_scripts/crossdrop_1.0.0_amd64.deb

  # 3. Build Android (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Scaffold Android Platform Files
        working-directory: ./client
        run: |
          flutter create . --platforms=android --org com.crossdrop
          chmod +x ../build_scripts/android/patch_android.sh
          ../build_scripts/android/patch_android.sh

      - name: Install Dependencies & Align Plugin SDKs
        working-directory: ./client
        run: |
          flutter pub get
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Making pub cache writable..."
          chmod -R u+w "$PUB_DIR" || true
          echo "Aligning pub packages to compileSdk 36..."
          find "$PUB_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i \
            -e 's/compileSdkVersion[[:space:]]\+[0-9]\+/compileSdkVersion 36/g' \
            -e 's/compileSdkVersion[[:space:]]\+flutter\.compileSdkVersion/compileSdkVersion 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' \
            -e 's/compileSdkVersion([0-9]\+)/compileSdkVersion(36)/g' \
            -e 's/compileSdkVersion(flutter\.compileSdkVersion)/compileSdkVersion(36)/g' \
            {} +
          echo "=== Patched files verification ==="
          grep -rn "compileSdk" "$PUB_DIR"/hosted/*/*/android/build.gradle* || true

      - name: Build APK Release
        working-directory: ./client
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          cp client/build/app/outputs/flutter-apk/app-release.apk crossdrop-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Android-APK
          path: crossdrop-release.apk

  # 4. Automatically Create GitHub Release with all 3 binaries
  publish-release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrossDrop-Windows-x64
          path: ./release-assets

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrossDrop-Windows-Setup
          path: ./release-assets

      - name: Download Linux .deb Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrossDrop-Linux-Debian
          path: ./release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: CrossDrop-Android-APK
          path: ./release-assets

      - name: Determine Release Tag
        id: release_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep '^version:' client/pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: "CrossDrop ${{ steps.release_version.outputs.tag }} (Windows Setup .exe, Linux .deb, Android .apk)"
          body: |
            ## Fertige Downloads für CrossDrop 🚀
            
            - 🪟 **Windows Setup-Installer (.exe):** `CrossDrop-Windows-Setup.exe` (Empfohlen: Installation mit Desktop- & Startmenü-Verknüpfung)
            - 🪟 **Windows Portable (.zip):** `CrossDrop-Windows-x64.zip` (Ohne Installation direkt starten)
            - 🐧 **Linux (Debian/Ubuntu):** `crossdrop_*.deb`
            - 📱 **Android:** `crossdrop-release.apk` (auf Android installieren)
          files: |
            ./release-assets/CrossDrop-Windows-Setup.exe
            ./release-assets/CrossDrop-Windows-x64.zip
            ./release-assets/crossdrop*.deb
            ./release-assets/crossdrop-release.apk